name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - run: uv build

      # Trusted publishing. No API token is stored in this repository.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
